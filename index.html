/* final overrides: pure white + home 70/30 */

.pet,.banner{border-radius:16px}
.banner{box-shadow:4px 4px 0 #000}
#featGrid{counter-reset:f}
.fcard{counter-increment:f;gap:14px;border-radius:14px;animation:rise .5s ease both}
.fcard::before{content:counter(f,decimal-leading-zero);flex:none;width:38px;height:38px;border:1.5px solid #000;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 .8rem "Poppins",sans-serif;color:#000}
.fcard:hover,.fcard:focus-visible{transform:translate(-2px,-2px);box-shadow:4px 4px 0 #000}
.fcard:nth-child(2){animation-delay:.05s}.fcard:nth-child(3){animation-delay:.1s}.fcard:nth-child(4){animation-delay:.15s}.fcard:nth-child(5){animation-delay:.2s}.fcard:nth-child(6){animation-delay:.25s}.fcard:nth-child(7){animation-delay:.3s}.fcard:nth-child(8){animation-delay:.35s}
.tabs{display:flex;flex-wrap:nowrap;gap:0;width:100%;max-width:580px;border:1.5px solid #000;border-radius:14px;overflow:hidden;background:#fff;margin-bottom:24px}
.tabs button{flex:1 1 auto;border:0;border-right:1.5px solid #000;border-radius:0;box-shadow:none;min-height:48px;background:#fff}
.tabs button:last-child{border-right:1.5px solid transparent}

.tabs button[aria-selected="true"]{border:0;border-right:1.5px solid #000;box-shadow:inset 0 -5px 0 #000;font-weight:700}
.tabs button[aria-selected="true"]:last-child{border-right:1.5px solid transparent}
.rform label{font-size:.8rem;text-transform:uppercase;letter-spacing:.07em}
footer{border-top:3px solid #000;padding-top:40px}

  // Apps Script bridge: simple POST (text/plain, no preflight) -> JSON response.
  function apiPost(data){
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var timer = window.setTimeout(function(){ if(ctrl) ctrl.abort(); }, 30000);
    return fetch(API_URL, {method:'POST', body:JSON.stringify(data), redirect:'follow', signal: ctrl ? ctrl.signal : undefined})
      .then(function(r){ return r.text(); })
      .then(function(txt){
        try { return JSON.parse(txt); }
        catch(e){ throw new Error('Hindi valid ang sagot ng backend. I-redeploy ang Apps Script (New version) at siguraduhing "Anyone" ang access.'); }
      })
      .catch(function(err){
        if(err && err.name === 'AbortError') throw new Error('Nag-timeout ang backend. Subukan ulit.');
        if(err instanceof TypeError) throw new Error('Hindi maabot ang backend. Tingnan ang internet at ang API_URL.');
        throw err;
      })
      .finally(function(){ window.clearTimeout(timer); });
  }
  function loadPets(){
    return new Promise(function(resolve, reject){
      var cb = 'sasPetsCallback_' + Date.now() + '_' + Math.floor(Math.random()*10000);
      var script = document.createElement('script');
      var finished = false;
      window[cb] = function(data){
        if(finished) return; finished = true;
        delete window[cb]; script.remove();
        if(!data || !data.success){ reject(new Error((data && data.message) || 'Hindi makuha ang pet listings.')); return; }
        pets = (data.pets || []).map(function(p){ return {id:p.id, name:p.name, k:p.type, o:p.otherType, gender:p.gender, description:p.description, photo:p.photoUrl, adoptedAt:p.adoptedAt}; });
        adoptedPets = (data.history || []).map(function(p){ return {id:p.id, name:p.name, k:p.type, o:p.otherType, gender:p.gender, description:p.description, photo:p.photoUrl, adoptedAt:p.adoptedAt}; });
        renderPets(); resolve(data);
      };
      script.onerror = function(){ if(finished) return; finished = true; delete window[cb]; script.remove(); reject(new Error('Hindi ma-access ang Google Sheets backend.')); };
      script.src = API_URL + '?action=list&callback=' + encodeURIComponent(cb) + (apiToken ? '&token=' + encodeURIComponent(apiToken) : '') + '&_=' + Date.now();
      document.head.appendChild(script);
      window.setTimeout(function(){ if(!finished){ finished = true; delete window[cb]; script.remove(); reject(new Error('Nag-timeout ang pagkuha ng listings.')); } }, 20000);
    });
  }

  function shrink(src, cb){
    var im = new Image();
    im.onload = function(){
      var r = Math.min(1, 640/Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width*r); c.height = Math.round(im.height*r);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      try { cb(c.toDataURL('image/jpeg', 0.72)); } catch(e){ cb(src); }
    };
    im.onerror = function(){ cb(src); };
    im.src = src;
  }

    var t = T[lang], g = document.getElementById('petGrid'), hg = document.getElementById('adoptedGrid');
    if(!g) return;
    g.innerHTML = pets.length ? pets.slice().reverse().map(function(p){ return petCard(p,t,false); }).join('') : '<p class="note">'+t.al_empty+'</p>';
    if(hg) hg.innerHTML = adoptedPets.length ? adoptedPets.slice().reverse().map(function(p){ return petCard(p,t,true); }).join('') : '<p class="note">'+t.al_history_empty+'</p>';
    var hist = document.getElementById('adoptionHistory');
    if(hist) hist.hidden = !document.body.classList.contains('admin-mode');
  }
  function petAction(e){
    var b = e.target.closest('[data-act]'); if(!b) return;
    if(b.dataset.act === 'adopted' && document.body.classList.contains('admin-mode')){
      b.disabled = true;
      apiPost({action:'adoptPet', token:apiToken, id:b.dataset.id}).then(function(result){
        if(!result || !result.success) throw new Error((result && result.message) || 'Hindi na-update ang adoption status.');
        return loadPets();
      }).catch(function(err){ alert(err.message); b.disabled = false; });
    }
    if(b.dataset.act === 'delete' && document.body.classList.contains('admin-mode')){
      var D = DELT[lang] || DELT.en;
      if(!window.confirm(D.confirm)) return;
      b.disabled = true;
      apiPost({action:'deletePet', token:apiToken, id:b.dataset.id}).then(function(result){
        if(!result || !result.success) throw new Error((result && result.message) || D.fail);
        return loadPets();
      }).catch(function(err){ alert(err.message); b.disabled = false; });
    }
  }
  document.getElementById('petGrid').addEventListener('click', petAction);
  document.getElementById('adoptedGrid').addEventListener('click', petAction);

  document.getElementById('adSend').addEventListener('click',function(){
    var t = T[lang], name = val('adName'), gender = val('adGender'), description = val('adDescription'), sel = document.getElementById('adType');
    if(!document.body.classList.contains('admin-mode') || !apiToken){ adOut.textContent = 'Mag-login muna bilang admin.'; return; }
    if(!name || !gender || !description){ adOut.textContent = t.ad_need; return; }
    var adO = val('adOther');
    if(sel.value === 'other' && !adO){ adOut.textContent = t.ad_need_other; return; }
    var send = document.getElementById('adSend'); send.disabled = true; adOut.textContent = 'Uploading listing...';
    apiPost({action:'addPet', token:apiToken, name:name, type:sel.value, otherType:adO, gender:gender, description:description, photoBase64:adPhoto || '', photoMimeType:'image/jpeg', photoName:(name.replace(/[^a-z0-9_-]/gi,'_') || 'pet')+'.jpg'})
      .then(function(result){
        if(!result || !result.success) throw new Error((result && result.message) || 'Hindi na-save ang pet listing.');
        ['adName','adDescription','adOther'].forEach(function(id){ document.getElementById(id).value = ''; });
        document.getElementById('adPhoto').value = ''; document.getElementById('adPrev').hidden = true; adPhoto = '';
        adOut.textContent = 'Pet listing successfully uploaded!';
        return loadPets();
      }).catch(function(err){ adOut.textContent = err.message; }).finally(function(){ send.disabled = false; });
  });
  [['rpType','rpOther'],['adType','adOther']].forEach(function(ids){
    var sel = document.getElementById(ids[0]), oth = document.getElementById(ids[1]);
    sel.addEventListener('change',function(){ oth.hidden = (sel.value !== 'other'); if(!oth.hidden) oth.focus(); });
  });

  var CONTACTS = [
    {n:'Philippine Animal Welfare Society (PAWS)', p:'475-1688', tel:'4751688'},
    {n:'PETA Asia (Manila)', p:'+63-2-8817-5292', tel:'+63288175292'}
  ];
  var GO = ['vets','report','volunteer','adopt','res','adopt','volunteer','res'];
  document.getElementById('featGrid').addEventListener('click',function(e){
    var b = e.target.closest('.fcard'); if(!b) return;
    var g = b.dataset.go;
    if(g === 'vets'){ location.hash = 'vets'; return; }
    if(g === 'res'){ location.hash = 'resources'; return; }
    tab = g; renderPanel();
    location.hash = 'help';
  });
  function renderLists(){
    var t = T[lang];
    document.getElementById('missionGrid').innerHTML = t.mission.map(function(c){return '<div class="card"><h3>'+c.t+'</h3><p>'+c.d+'</p></div>';}).join('');
    document.getElementById('featGrid').innerHTML = t.feats.map(function(c,i){return '<button type="button" class="fcard" data-go="'+GO[i]+'"><span class="ftxt"><strong>'+c.t+'</strong><small>'+c.d+'</small></span></button>';}).join('');
    document.getElementById('resGrid').innerHTML = t.res.map(function(c){var l = c.u ? '<a href="https://'+c.u+'" target="_blank" rel="noopener">'+c.u+'</a>' : ''; return '<div class="card"><h3>'+c.t+'</h3><p>'+c.d+'</p>'+l+'</div>';}).join('');
  }
  function apply(){
    document.documentElement.lang = lang === 'fil' ? 'fil' : 'en';
    document.querySelectorAll('[data-i]').forEach(function(el){ el.innerHTML = T[lang][el.dataset.i]; });
    nameEl.placeholder = T[lang].name_ph;
    document.getElementById('areaIn').placeholder = T[lang].vet_area_ph;
    document.getElementById('rpLoc').placeholder = T[lang].rp_loc_ph;
    document.getElementById('rpNote').placeholder = T[lang].rp_note_ph;
    document.getElementById('adName').placeholder = T[lang].ad_name_ph;
    document.getElementById('adDescription').placeholder = T[lang].ad_description_ph;
    ['rpOther','adOther'].forEach(function(id){ var el = document.getElementById(id), k = (id==='rpOther' ? 'rp_other_ph' : 'ad_other_ph'); el.placeholder = T[lang][k]; el.setAttribute('aria-label', T[lang][k]); });
    nameEl.setAttribute('aria-label', T[lang].name_ph);
    langSel.value = lang;
    var adminBtn = document.getElementById('adminModeBtn');
    if(adminBtn) adminBtn.textContent = document.body.classList.contains('admin-mode') ? T[lang].admin_exit : T[lang].admin_mode;
    msg.textContent = '';
    renderPanel();
    renderLists();
    renderVet();
    renderPets();
  }
  tabs.forEach(function(b){b.addEventListener('click',function(){tab=b.dataset.tab;renderPanel();});});
  langSel.addEventListener('change',function(){
    lang = langSel.value;
    try { localStorage.setItem('lang', lang); } catch(e){}
    apply();
  });

  var gear = document.getElementById('gear'), box = document.getElementById('settings');
  gear.addEventListener('click',function(){
    var open = box.hidden;
    box.hidden = !open;
    gear.setAttribute('aria-expanded', String(open));
  });
  // Admin authentication is checked by the Apps Script backend.
  var adminModeBtn = document.getElementById('adminModeBtn');
  var adminModeMsg = document.getElementById('adminModeMsg');
  var adminTab = document.querySelector('.tabs button[data-tab="adopt"]');
  adminModeBtn.addEventListener('click',function(){
    if(document.body.classList.contains('admin-mode')){
      document.body.classList.remove('admin-mode');
      apiPost({action:'logout', token:apiToken}).catch(function(){});
      apiToken = '';
      adminTab.hidden = true;
      if(tab === 'adopt') tab = 'feed';
      adminModeMsg.textContent = T[lang].admin_off;
      renderPanel(); renderPets(); loadPets().catch(function(){});
      adminModeBtn.textContent = T[lang].admin_mode;
      return;
    }
    var password = window.prompt(T[lang].admin_locked);
    if(password === null || !password) return;
    adminModeBtn.disabled = true;
    adminModeMsg.textContent = 'Verifying admin access...';
    apiPost({action:'login', password:password}).then(function(result){
      if(!result || !result.success || !result.token) throw new Error((result && result.message) || T[lang].admin_wrong);
      apiToken = result.token;
      document.body.classList.add('admin-mode');
      adminTab.hidden = false;
      adminModeMsg.textContent = T[lang].admin_on;
      adminModeBtn.textContent = T[lang].admin_exit;
      renderPanel(); renderPets(); loadPets().catch(function(){});
    }).catch(function(err){ adminModeMsg.textContent = err.message || T[lang].admin_wrong; }).finally(function(){ adminModeBtn.disabled = false; });
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ box.hidden = true; gear.setAttribute('aria-expanded','false'); }});

  var count = 0, countEl = document.getElementById('count');
  try { count = parseInt(localStorage.getItem('pledges')||'0',10) || 0; } catch(e){}
  countEl.textContent = count;
  document.getElementById('pledgeBtn').addEventListener('click',function(){
    var n = nameEl.value.trim();
    if(!n){ msg.textContent = T[lang].need_name; return; }
    count++;
    countEl.textContent = count;
    try { localStorage.setItem('pledges', String(count)); } catch(e){}
    msg.textContent = T[lang].thanks(n.replace(/[<>&]/g,''));
    nameEl.value = '';
  });

  function showView(){
    var v = (location.hash || '#home').slice(1);
    if(['home','adopt','vets','help','resources','about'].indexOf(v) < 0) v = 'home';
    document.querySelectorAll('[data-view]').forEach(function(el){ el.hidden = (el.dataset.view !== v); });
    document.querySelectorAll('nav a').forEach(function(a){
      if(a.getAttribute('href') === '#'+v) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
    });
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange', showView);
  apply();
  showView();
  loadPets().catch(function(err){ var g=document.getElementById('petGrid'); if(g) g.innerHTML='<p class="note">'+esc(err.message)+'</p>'; });
})();
</script>
</body>
</html>
